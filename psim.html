<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sistema de seguridad</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf1;--panel:#fff;--ink:#1c2a36;--mute:#62758a;--line:#8aa0b4;--room:#f7f9fb;--wall:#33475b;--ok:#2a9d68;--warn:#d9971a;--al:#d63a3a;--acc:#2b6a99;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181f;--panel:#19242e;--ink:#e3ebf2;--mute:#8da0b2;--line:#4d647a;--room:#141e27;--wall:#a9bccd;--acc:#6aa9d6}}
:root[data-theme="dark"]{--bg:#10181f;--panel:#19242e;--ink:#e3ebf2;--mute:#8da0b2;--line:#4d647a;--room:#141e27;--wall:#a9bccd;--acc:#6aa9d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "IBM Plex Sans",system-ui,sans-serif}
.top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:14px 12px 10px}
h1{font-size:18px;margin:0 auto 0 4px;font-weight:600}
.chip{padding:4px 10px;border-radius:99px;background:var(--panel);font-size:13px;display:flex;gap:6px;align-items:center}
.chip i,.rows i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
button{font:inherit;border:0;border-radius:6px;padding:8px 14px;background:var(--acc);color:#fff;cursor:pointer;font-weight:600}
#ack{background:var(--al)}
button:focus-visible,.dev:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 12px 10px}
.pc{background:var(--panel);border-radius:8px;padding:10px;border-left:6px solid var(--pc);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.pc[aria-pressed=true]{outline:2px solid var(--pc)}
.pn{font-weight:600}.ps{font-size:13px;color:var(--mute)}.ps.s-alarm{color:var(--al);font-weight:600}
.pc button{padding:6px 10px;background:var(--pc)}.pc button.on{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:6px;margin:0 12px 8px;overflow-x:auto}
.tabs button{background:var(--panel);color:var(--ink);font-weight:400;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--acc);color:#fff}
.tabs b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--al);margin-left:6px}
.wrap{position:relative;margin:0 12px;background:var(--panel);border-radius:8px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.wo{fill:none;stroke:var(--wall);stroke-width:8}
.wi{fill:none;stroke:var(--wall);stroke-width:5;stroke-linecap:square}
.gl{stroke:var(--acc);stroke-width:1.5;fill:none}.gd{stroke-dasharray:7 4;stroke-width:3}
.dl{stroke:var(--wall);stroke-width:2}.da{fill:none;stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3}
.fu{fill:none;stroke:var(--line);stroke-width:1.4}
.rl{fill:var(--mute);font-size:17px;font-weight:600}
.dev{cursor:pointer}.dev.dim{opacity:.22}
.dev .bg{fill:var(--c);stroke:var(--panel);stroke-width:2.5}
.dev .g{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dev .v{font:500 14px "IBM Plex Mono",monospace;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--room);stroke-width:4px}
.s-ok{--c:var(--ok)}.s-warn{--c:var(--warn)}.s-alarm{--c:var(--al)}
.ring{fill:none;stroke:var(--al);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:p 1.2s ease-out infinite}
@keyframes p{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
#pop{position:absolute;width:330px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.3);padding:12px;z-index:5}
#pop[hidden]{display:none}
#pop h2{font-size:15px;margin:0;font-weight:600}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.x{background:none;color:var(--mute);padding:0 4px;font-size:20px;line-height:1}
.meta{color:var(--mute);font-size:13px;margin:2px 0 8px}
#cv{width:100%;aspect-ratio:16/9;border-radius:4px;background:#000;display:block}
.st{display:flex;gap:8px;align-items:center;font-weight:600;margin-top:8px}
.st i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.big{font:500 28px "IBM Plex Mono",monospace;margin:6px 0}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:13px}
dl.kv dt{color:var(--mute)}dl.kv dd{margin:0;text-align:right}
h3{font-size:14px;margin:18px 16px 6px}
ul.rows{list-style:none;margin:0 12px 8px;padding:0;background:var(--panel);border-radius:8px}
.rows li{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--bg);font-size:14px}
.rows li[data-id]{cursor:pointer}
.rows time{font-family:"IBM Plex Mono",monospace;color:var(--mute);font-size:13px}
.rows em{margin-left:auto;font-style:normal;color:var(--mute);font-size:13px;text-align:right}
.rows small{display:block;color:var(--mute);font-size:12px}
.rows .alarm{color:var(--al);font-weight:600}.rows .warn{color:var(--warn)}
.note{margin:12px 16px 20px;color:var(--mute);font-size:13px}
@media (max-width:640px){#pop{position:fixed;left:0!important;right:0;bottom:0;top:auto!important;width:auto;border-radius:12px 12px 0 0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<div class="top">
  <h1>Instalación</h1>
  <span class="chip s-alarm"><i></i><b id="nA">0</b> alarmas</span>
  <span class="chip s-warn"><i></i><b id="nW">0</b> avisos</span>
  <span class="chip s-ok"><i></i><b id="nO">0</b> normales</span>
  <button id="ack" hidden>Reconocer alarmas</button>
  <button id="all">Armar todas</button>
</div>
<div class="parts" id="parts"></div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <svg id="plan" viewBox="0 0 800 500" role="img" aria-label="Plano de la instalación"><g id="rooms"></g><g id="devs"></g></svg>
  <div id="pop" hidden></div>
</div>
<h3>Equipos</h3>
<ul class="rows" id="eq"></ul>
<h3>Últimos eventos</h3>
<ul class="rows" id="log"></ul>
<p class="note">Datos simulados. Toca una partición para ver solo sus dispositivos; el botón la arma o desarma. Toca un icono o un equipo para ver su estado.</p>
<script>
const $=s=>document.querySelector(s),pick=a=>a[Math.floor(Math.random()*a.length)];
const set=(el,h)=>{if(el._h!==h){el._h=h;el.innerHTML=h}};
const PT={P1:{n:'Planta baja',c:'#3b82c4',a:0},P2:{n:'Zona noche',c:'#8b6fd0',a:0},P3:{n:'Garaje',c:'#1aa3a3',a:0}};
const PL={

['w','h',300,20,90],['w','h',440,20,90],['w','h',80,20,100],['w','v',20,70,70],['w','h',590,20,40],['w','v',780,200,60],['w','h',500,480,100],['w','h',650,480,90],['w','v',780,380,60]],
F:[['r',26,26,200,24],['r',26,26,24,150],['r',90,110,100,40],['s',250,215,170,50],['r',290,150,100,40],['o',455,120,90,70],['o',612,38,26,32],['r',595,100,45,20],['k',690,160,80,160],['r',600,345,130,40],['o',650,395,28,28],['r',752,340,22,130],['v',60,260,130,200],['r',676,26,98,14]]},

['w','h',100,20,100],['w','h',340,20,120],['w','h',600,20,120],['w','v',20,100,80],['w','v',780,100,80],['w','h',80,480,60],['w','h',620,480,100],['w','v',780,390,60]],
F:[['b',60,60,120,150],['b',340,70,100,140],['b',640,70,100,140],['r',252,30,30,140],['r',525,30,24,100],['r',26,350,56,120],['o',186,440,22,30],['r',150,348,52,18],['r',224,344,12,130],['r',386,344,12,130],['k',420,350,120,120],['r',600,350,130,40],['o',650,398,26,26],['r',752,350,24,120]]}};
const D=[];const A=(p,l)=>l.forEach(a=>D.push({p,id:a[0],t:a[1],n:a[2],z:a[3],x:a[4],y:a[5],b:a[6]}));

['d1','door','Puerta principal','Hall',340,480],['w1','door','Ventana salón 1','Salón',345,20],['w2','door','Ventana salón 2','Salón',485,20],['w3','door','Ventana cocina','Cocina',130,20],['w4','door','Ventana despacho','Despacho',550,480],['w5','door','Ventana escalera','Escalera',780,230],['d2','door','Portón garaje','Garaje',125,480],
['p1','pir','Movimiento salón','Salón',500,260],['p2','pir','Movimiento hall','Hall',360,400],['p3','pir','Movimiento despacho','Despacho',520,430],['p4','pir','Movimiento garaje','Garaje',210,350],['p5','pir','Movimiento cocina','Cocina',190,90],
['t1','temp','Temperatura salón','Salón',520,70,21],['t2','temp','Temperatura cocina','Cocina',120,180,23],['t3','temp','Temperatura cuarto técnico','Técnico',725,108,24],['t4','temp','Temperatura garaje','Garaje',45,250,17],
['s1','smoke','Detector de humo cocina','Cocina',200,180],
['ce','ctr','Central de alarma','Técnico',702,70,'Central'],['nv','nvr','Grabador NVR','Técnico',752,70,'NVR'],['e1','exp','Expansor 1 · Planta baja','Hall',260,445,'EXP 1']]);
A('pa',[['c4','cam','Cámara distribuidor','Distribuidor',40,285],['c5','cam','Cámara estudio','Estudio',765,360],
['w6','door','Ventana dormitorio principal','Dormitorio principal',150,20],['w7','door','Ventana dormitorio 2','Dormitorio 2',400,20],['w8','door','Ventana dormitorio 3','Dormitorio 3',660,20],['w9','door','Ventana baño','Baño',110,480],['w10','door','Ventana estudio','Estudio',670,480],['w11','door','Ventana lateral dormitorio 3','Dormitorio 3',780,140],
['p6','pir','Movimiento dormitorio principal','Dormitorio principal',215,200],['p7','pir','Movimiento dormitorio 2','Dormitorio 2',480,200],['p8','pir','Movimiento dormitorio 3','Dormitorio 3',590,200],['p9','pir','Movimiento distribuidor','Distribuidor',400,300],['p10','pir','Movimiento estudio','Estudio',620,440],
['t5','temp','Temperatura dormitorio principal','Dormitorio principal',225,60,21],['t6','temp','Temperatura dormitorio 2','Dormitorio 2',480,60,20],['t7','temp','Temperatura estudio','Estudio',730,440,22],
['s2','smoke','Detector de humo distribuidor','Distribuidor',600,300],
['e2','exp','Expansor 2 · Planta alta','Distribuidor',200,300,'EXP 2']]);
const isEq=d=>d.t==='ctr'||d.t==='exp'||d.t==='nvr';
D.forEach(d=>{d.v=isEq(d)?0:(d.b||0);d.open=false;d.on=false;d.al=false;d.off=false;d.until=0;d.ac=true;d.bat=100;d.hdd=62;
 d.pt=isEq(d)?null:PL[d.p].R.find(r=>r[0]===d.z)[5]});
const G={
cam:'<rect x="-8" y="-5" width="11" height="10" rx="2"/><path d="M3-2 8-5V5L3 2"/>',
door:'<path d="M-5-8H5V8H-5Z"/><path d="M2 0h.1"/>',
dooro:'<path d="M-5-8 6-5V8H-5Z"/><path d="M3 1h.1"/>',
pir:'<circle r="2"/><path d="M-7 0a7 7 0 0 1 14 0M-7 0a7 7 0 0 0 14 0"/>',
temp:'<path d="M-2-8a2 2 0 0 1 4 0V2a4 4 0 1 1-4 0Z"/>',
smoke:'<path d="M-7 4a3 3 0 0 1 1-5.5 4 4 0 0 1 7.5-1A3.5 3.5 0 0 1 7 4Z"/>',
ctr:'<rect x="-9" y="-6" width="18" height="12" rx="1.5"/><path d="M-5-2h4M-5 2h4M3-3v6"/>',
exp:'<rect x="-6" y="-6" width="12" height="12"/><path d="M-3-9v3M3-9v3M-3 6v3M3 6v3M-9-3h3M-9 3h3M6-3h3M6 3h3"/>',
nvr:'<rect x="-9" y="-8" width="18" height="7" rx="1.5"/><rect x="-9" y="1" width="18" height="7" rx="1.5"/><path d="M5-4.5h.1M5 4.5h.1"/>'};
const kind={cam:'Cámara CCTV',door:'Contacto magnético',pir:'Sensor de movimiento (PIR)',temp:'Sensor de temperatura',smoke:'Detector de humo',ctr:'Central de alarma',exp:'Módulo expansor',nvr:'Grabador de vídeo (NVR)'};
let cur='pb',sel=null,raf=0,fp=null,logs=[];
const cams=()=>D.filter(x=>x.t==='cam');
const st=d=>{if(d.al)return'alarm';
 if(d.t==='cam')return d.off?'warn':'ok';
 if(d.t==='door')return d.open?'warn':'ok';
 if(d.t==='pir')return d.on?'warn':'ok';
 if(d.t==='temp')return(d.v>30||d.v<14)?'alarm':(d.v>26||d.v<17)?'warn':'ok';
 if(isEq(d))return d.off?'alarm':(!d.ac||d.bat<30||(d.t==='nvr'&&(d.hdd>90||cams().some(c=>c.off))))?'warn':'ok';
 return'ok'};
const txt=d=>{switch(d.t){
 case'cam':return d.off?'Sin señal':'En línea';
 case'door':return d.open?'Abierta':'Cerrada';
 case'pir':return d.on?'Movimiento detectado':'Sin movimiento';
 case'temp':return d.v.toFixed(1)+' °C';
 case'smoke':return d.al?'Humo detectado':'Normal';
 case'nvr':return cams().filter(c=>!c.off).length+'/'+cams().length+' canales grabando';
 default:return d.off?'Sin comunicación':d.ac?'En línea':'Fallo de red 220 V'}};
const kv=d=>{const L=[['Ubicación',d.z+' · '+PL[d.p].n]];

 if(d.t==='ctr'||d.t==='exp')L.push(['Alimentación',d.ac?'Red 220 V':'Batería'],['Batería',Math.round(d.bat)+' %']);
 if(d.t==='nvr')L.push(['Disco',Math.round(d.hdd)+' % ocupado']);

const roomsHTML=()=>{const P=PL[cur];
 return'<rect x="20" y="20" width="760" height="460" fill="var(--room)"/>'+

function render(){

  return`<div class="pc" data-k="${k}" aria-pressed="${fp===k}" style="--pc:${P.c}"><div class="pn">${P.n}</div><div class="ps${al?' s-alarm':''}">${al?'ALARMA':P.a?'Armada':'Desarmada'}</div><button class="${P.a?'on':''}" data-arm="${k}">${P.a?'Desarmar':'Armar'}</button></div>`}).join(''));
 set($('#eq'),D.filter(isEq).map(d=>`<li data-id="${d.id}"><i class="s-${st(d)}"></i><span>${d.n}<small>${d.z} · ${PL[d.p].n}</small></span><em>${txt(d)}</em></li>`).join(''));
 const c={alarm:0,warn:0,ok:0};D.forEach(d=>c[st(d)]++);
 $('#nA').textContent=c.alarm;$('#nW').textContent=c.warn;$('#nO').textContent=c.ok;
 $('#ack').hidden=!D.some(d=>d.al);
 $('#all').textContent=Object.values(PT).every(p=>p.a)?'Desarmar todas':'Armar todas';
 if(sel)upd()}
function openPop(id){sel=id;const d=D.find(x=>x.id===id),p=$('#pop');cancelAnimationFrame(raf);
 p.innerHTML=`<div class="ph"><h2>${d.n}</h2><button class="x" aria-label="Cerrar">×</button></div><div class="meta">${kind[d.t]}</div>`+
  (d.t==='cam'?'<canvas id="cv" width="320" height="180"></canvas>':d.t==='temp'?'<div class="big" id="pv"></div>':'')+
  '<div class="st s-ok" id="pst"><i></i><span></span></div><dl class="kv" id="pkv"></dl>';
 p.hidden=false;p.querySelector('.x').onclick=closePop;upd();
 const W=$('.wrap'),px=W.clientWidth*d.x/800,py=W.clientHeight*d.y/500;
 p.style.left=Math.max(8,Math.min(px+24,W.clientWidth-338))+'px';
 p.style.top=Math.max(8,Math.min(py-30,W.clientHeight-p.offsetHeight-8))+'px';
 if(d.t==='cam')loop(0)}
function closePop(){sel=null;cancelAnimationFrame(raf);$('#pop').hidden=true}
function upd(){const d=D.find(x=>x.id===sel),s=st(d),e=$('#pst');
 e.className='st s-'+s;e.querySelector('span').textContent=txt(d)+(d.al?' · alarma':'');
 const v=$('#pv');if(v)v.textContent=d.v.toFixed(1)+' °C';set($('#pkv'),kv(d))}
function loop(t){const d=D.find(x=>x.id===sel);if(!d||d.t!=='cam')return;
 const cv=$('#cv'),g=cv.getContext('2d'),w=320,h=180;
 if(d.off){g.fillStyle='#111';g.fillRect(0,0,w,h);g.fillStyle='#e55';g.font='16px "IBM Plex Mono",monospace';g.fillText('SIN SEÑAL',110,95);raf=requestAnimationFrame(loop);return}
 const hue=(parseInt(d.id.slice(1))*53)%360,gr=g.createLinearGradient(0,0,0,h);
 gr.addColorStop(0,`hsl(${hue} 15% 24%)`);gr.addColorStop(1,`hsl(${hue} 12% 10%)`);
 g.fillStyle=gr;g.fillRect(0,0,w,h);g.strokeStyle='rgba(255,255,255,.12)';g.beginPath();
 g.moveTo(0,h*.6);g.lineTo(w,h*.6);g.moveTo(w*.3,0);g.lineTo(w*.3,h*.6);g.moveTo(w*.7,0);g.lineTo(w*.7,h*.6);g.stroke();
 if(D.some(p=>p.t==='pir'&&p.p===d.p&&p.z===d.z&&p.on)){const x=w*(.5+.32*Math.sin(t/900));g.fillStyle='rgba(0,0,0,.8)';
  g.beginPath();g.ellipse(x,h*.78,16,34,0,0,7);g.fill();g.beginPath();g.arc(x,h*.78-44,11,0,7);g.fill()}
 for(let i=0;i<80;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.12})`;g.fillRect(Math.random()*w,Math.random()*h,2,1)}
 g.font='12px "IBM Plex Mono",monospace';g.fillStyle='#fff';g.fillText(new Date().toLocaleTimeString('es-ES'),8,h-8);g.fillText(d.n,8,16);
 g.fillStyle='#e53';g.beginPath();g.arc(w-14,12,4,0,7);g.fill();g.fillStyle='#fff';g.fillText('REC',w-46,16);
 raf=requestAnimationFrame(loop)}
function trig(d,msg){d.until=Date.now()+(d.t==='door'?5000:3500);
 if(d.t==='door')d.open=true;else d.on=true;
 if(PT[d.pt].a){d.al=true;ev('ALARMA · '+msg+' ('+PT[d.pt].n+')','alarm')}}
function tick(){const n=Date.now();
 D.forEach(d=>{if(d.t==='temp')d.v+=(d.b-d.v)*.12+(Math.random()-.5)*.35;
  if(d.t==='door'&&d.open&&n>d.until){d.open=false;if(PT[d.pt].a)ev(d.n+': cerrada','')}
  if(d.t==='pir'&&d.on&&n>d.until)d.on=false;
  if(d.t==='cam'&&d.off&&n>d.until){d.off=false;ev(d.n+': señal recuperada','')}
  if(isEq(d)){if(d.off&&n>d.until){d.off=false;ev(d.n+': comunicación recuperada','')}
   if(!d.ac&&n>d.until){d.ac=true;ev(d.n+': red 220 V restablecida','')}
   if(d.t==='nvr')d.hdd=Math.min(99,d.hdd+.03);else d.bat=Math.max(0,Math.min(100,d.bat+(d.ac?2:-6)))}});
 if(Math.random()<.4){const d=pick(D.filter(x=>x.t==='door'||x.t==='pir'));
  if(!(d.open||d.on))trig(d,d.t==='door'?d.n+': abierta':d.n)}
 if(Math.random()<.03){const t=D.find(x=>x.id==='t3');t.v+=6;ev('Aviso · temperatura alta ('+t.n+')','warn')}
 if(Math.random()<.01){const s=pick(D.filter(x=>x.t==='smoke'));if(!s.al){s.al=true;ev('ALARMA · humo detectado ('+s.z+')','alarm')}}
 if(Math.random()<.02){const c=pick(cams().filter(x=>!x.off));if(c){c.off=true;c.until=n+7000;ev('Sin señal · '+c.n,'warn')}}
 if(Math.random()<.015){const e=pick(D.filter(x=>x.t==='exp'&&!x.off));if(e){e.off=true;e.until=n+6000;ev('ALARMA · '+e.n+': sin comunicación','alarm')}}
 if(Math.random()<.015){const e=D.find(x=>x.id==='ce');if(e.ac){e.ac=false;e.until=n+9000;ev('Aviso · '+e.n+': fallo de red 220 V','warn')}}
 render()}
const go=g=>{if(g)openPop(g.dataset.id)};
$('#devs').addEventListener('click',e=>go(e.target.closest('.dev')));
$('#devs').addEventListener('keydown',e=>{if(e.key==='Enter')go(e.target.closest('.dev'))});
$('#eq').addEventListener('click',e=>{const li=e.target.closest('li');if(li){const d=D.find(x=>x.id===li.dataset.id);cur=d.p;closePop();render();openPop(d.id)}});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){cur=b.dataset.k;closePop();render()}});
$('#parts').addEventListener('click',e=>{const a=e.target.closest('[data-arm]'),c=e.target.closest('.pc');if(!c)return;
 if(a){const P=PT[a.dataset.arm];P.a=P.a?0:1;ev('Partición «'+P.n+'»: '+(P.a?'armada':'desarmada'),'')}
 else fp=fp===c.dataset.k?null:c.dataset.k;
 render()});
$('#all').onclick=()=>{const v=Object.values(PT);const on=!v.every(p=>p.a);v.forEach(p=>p.a=on?1:0);ev(on?'Todas las particiones armadas':'Todas las particiones desarmadas','');render()};
$('#ack').onclick=()=>{D.forEach(d=>d.al=false);ev('Alarmas reconocidas','');render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
ev('Sistema iniciado (datos simulados)','');render();setInterval(tick,2000);
</script>
</body>
</html>
